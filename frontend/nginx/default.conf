# Frontend + proxy verso Strapi sullo stesso indirizzo.
#
# Dall'esterno passa SOLO /api/ (le rotte dell'app). /admin e le API del
# pannello (/content-manager, /upload, /users-permissions, ...) non arrivano mai
# a Strapi: qui ricevono la pagina dell'app. Il pannello admin, da cui si creano
# gli utenti, sta su una porta a parte
# (BUDGET_ADMIN_PORT nel compose) da limitare al proprio IP nel reverse proxy.

# Se davanti c'è un reverse proxy HTTPS il protocollo arriva in X-Forwarded-Proto.
map $http_x_forwarded_proto $budget_proto { default $scheme; https https; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Valori comuni a tutte le rotte /api.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $budget_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://backend:1337;
    }

    # Analisi estratto conto: più PDF/CSV insieme, e fino a ~2 minuti di AI lato
    # server (AI_BUDGET_MS). Il client aspetta 3 minuti: nginx deve stare sopra,
    # altrimenti col default di 60s l'analisi lunga finisce in un 504.
    location = /api/analisi-estratto-conto {
        client_max_body_size 25m;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_pass http://backend:1337;
    }

    # Foto dello scontrino: il server accetta fino a 15 MB e legge entro 60s.
    location = /api/scontrino/leggi {
        client_max_body_size 16m;
        proxy_read_timeout 100s;
        proxy_pass http://backend:1337;
    }

    # Foto profilo: il server accetta fino a 10 MB e la riduce a 256px.
    location = /api/profilo/foto {
        client_max_body_size 11m;
        proxy_pass http://backend:1337;
    }

    # Emoji Apple (PNG statiche, non cambiano mai)
    location /emoji/ { expires 30d; try_files $uri =404; }

    location = /health { access_log off; return 200 "ok"; }

    # SPA: ogni altro percorso è una pagina dell'app.
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { expires -1; }
    location = /budget-sw.js { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
